services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridex
      POSTGRES_PASSWORD: ridex
      POSTGRES_DB: ridex
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridex -d ridex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local OSRM. Prepare map data before enabling:
  # https://github.com/Project-OSRM/osrm-backend/wiki/Running-OSRM
  # osrm:
  #   image: osrm/osrm-backend:v5.27.1
  #   profiles: ["routing"]
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./osrm-data:/data
  #   command: osrm-routed --algorithm mld /data/map.osrm

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: pnpm --filter @ridex/backend start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      API_PREFIX: api/v1
      APP_NAME: RideX Backend
      LOG_LEVEL: log
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      DATABASE_URL: postgres://ridex:ridex@postgres:5432/ridex
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: dev-access-secret-change-me-to-strong-32+
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-to-strong-32+
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      AUTH_LOCKOUT_MAX_ATTEMPTS: "5"
      AUTH_LOCKOUT_WINDOW_MS: "900000"
      AUTH_LOCKOUT_DURATION_MS: "900000"
      REDIS_URL: redis://redis:6379
      DRIVER_LOCATION_TTL_SECONDS: "60"
      LOCATION_MAX_SPEED_MPS: "55"
      LOCATION_MAX_JUMP_METERS: "1000"
      LOCATION_JUMP_DETECTION_WINDOW_SECONDS: "30"
      WS_PATH: /socket.io
      H3_DISCOVERY_MAX_RING: "5"
      H3_STALE_SWEEP_INTERVAL_SECONDS: "30"
      OSRM_BASE_URL: http://osrm:5000
      OSRM_TIMEOUT_MS: "1500"
      ROUTING_FALLBACK_ROAD_FACTOR: "1.3"
      ROUTING_FALLBACK_CITY_SPEED_KMH: "30"
      ROUTING_ESTIMATE_CACHE_SIZE: "1024"
      ROUTING_ESTIMATE_CACHE_TTL_SECONDS: "60"
      MATCHING_MAX_CANDIDATES: "5"
      MATCHING_OFFER_TIMEOUT_SECONDS: "15"
      MATCHING_DISCOVERY_MAX_RING: "3"
      MATCHING_SCORE_DISTANCE_WEIGHT: "0.6"
      MATCHING_SCORE_ETA_WEIGHT: "0.4"
      PRICING_BASE_FARE_VND: "12000"
      PRICING_PER_KM_VND: "5000"
      PRICING_PER_MIN_VND: "500"
      PRICING_MINIMUM_FARE_VND: "15000"
      PRICING_SURGE_RATIO_THRESHOLD: "1.0"
      PRICING_SURGE_COEFFICIENT: "0.5"
      PRICING_SURGE_CAP: "3.0"
      PRICING_DEMAND_WINDOW_SECONDS: "300"
      PAYMENT_WALLET_SEED_VND: "500000"
      PAYMENT_DRIVER_SHARE_BPS: "8000"
      PAYMENT_PLATFORM_SHARE_BPS: "2000"
      # Optional: bootstrap a single ADMIN via migration. Leave blank to skip.
      ADMIN_BOOTSTRAP_EMAIL: ""
      ADMIN_BOOTSTRAP_PASSWORD: ""
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_app_node_modules:/app/apps/backend/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  backend_app_node_modules:
