appId: com.ridex.driver
env:
  FLOW_PREFIX: offer-leak
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runScript:
    file: scripts/prepare-driver.js
- tapOn:
    id: driver-login-email
- inputText: ${output.SEED_DRIVER_EMAIL}
- tapOn:
    id: driver-login-password
- inputText: ${output.SEED_DRIVER_PASSWORD}
- tapOn:
    id: driver-login-submit
- extendedWaitUntil:
    visible:
      id: driver-online-toggle-offline
    timeout: 10000
- tapOn:
    id: driver-online-toggle-offline
- extendedWaitUntil:
    visible:
      id: driver-status-online
    timeout: 5000
- runScript:
    file: scripts/dispatch-offer.js
- extendedWaitUntil:
    visible:
      id: driver-offer-screen
    timeout: 8000
- tapOn:
    id: driver-online-toggle-online
- tapOn: "Tắt"
- extendedWaitUntil:
    visible:
      id: driver-status-offline
    timeout: 5000
- assertNotVisible:
    id: driver-offer-screen
- tapOn:
    id: driver-online-toggle-offline
- extendedWaitUntil:
    visible:
      id: driver-status-online
    timeout: 5000
- assertNotVisible:
    id: driver-offer-screen
